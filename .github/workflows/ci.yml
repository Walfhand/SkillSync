name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SkillSync.slnx --configuration Release
      - run: dotnet run --project tests/SkillSync.Checks --configuration Release --no-build
      - name: Check release packaging
        shell: pwsh
        run: ./tests/packaging.ps1
      - run: dotnet pack src/SkillSync --configuration Release --no-build --output artifacts/packages
      - run: dotnet publish src/SkillSync --configuration Release --runtime ${{ matrix.rid }} -p:PublishProfile=Standalone --output artifacts/standalone/${{ matrix.rid }}
      - name: Check the executable for the runner's architecture
        shell: pwsh
        run: |
          $platform = switch ('${{ runner.os }}') {
            'Linux' { 'linux' }
            'Windows' { 'win' }
            'macOS' { 'osx' }
          }
          $architecture = '${{ runner.arch }}'.ToLowerInvariant()
          $extension = if ($platform -eq 'win') { '.exe' } else { '' }
          & "./artifacts/standalone/$platform-$architecture/skillsync$extension" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start an isolated runner's systemd user session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Exercise native installation, scheduling, update and complete removal
        env:
          SKILLSYNC_TEST_SCHEDULER: '1'
        shell: pwsh
        run: |
          $extension = if ('${{ runner.os }}' -eq 'Windows') { '.exe' } else { '' }
          dotnet run --project tests/SkillSync.Checks --configuration Release --no-build -- --native-lifecycle "./artifacts/standalone/${{ matrix.rid }}/skillsync$extension"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package release archives and SHA-256 checksums
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -InputDirectory artifacts/standalone/${{ matrix.rid }} -OutputDirectory artifacts/releases -RuntimeIdentifier ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skillsync-${{ matrix.rid }}
          path: artifacts/releases/skillsync-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: skillsync-*
          path: artifacts/releases
          merge-multiple: true
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=
          [[ "$GITHUB_REF_NAME" != *-* ]] || prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" artifacts/releases/* --verify-tag --generate-notes --title "SkillSync $GITHUB_REF_NAME" $prerelease
